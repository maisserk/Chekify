<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Gestión avanzada de inspecciones industriales."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Checkify" />
    <meta
      property="og:description"
      content="Gestión avanzada de inspecciones industriales."
    />
    <meta
      property="og:image"
      content="https://checkify.maisser.cl/logo.png"
    />
    <meta property="og:url" content="https://checkify.maisser.cl" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Checkify" />
    <meta
      name="twitter:description"
      content="Gestión avanzada de inspecciones industriales."
    />
    <meta
      name="twitter:image"
      content="https://checkify.maisser.cl/logo.png"
    />

    <title>Checkify | maisser.cl</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.error('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
